; Клиентская часть переключения на резервный сервер

; Описание параметров

; [SERVER]

; port=       Порт, на который будет подключаться клиент к серверу
;             для отдачи команд и получения ответа. По умолчанию 
;             будет выставлен порт 2748 (0xABC :-))
; OldIP=      IP адрес резервного сервера.

[SERVER]
Port=2748
OldIP=192.168.1.136
